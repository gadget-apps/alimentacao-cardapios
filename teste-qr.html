<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR de teste — NFC-e fictícia</title>
  <link rel="stylesheet" href="estilo.css?v=36" />
  <style>
    .qr-box {
      text-align: center;
      padding: 1rem 0 0.5rem;
    }
    .qr-box img {
      width: min(100%, 320px);
      height: auto;
      background: #fff;
      padding: 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <nav class="nav" hidden></nav>
    <section class="hero">
      <h1>QR de teste</h1>
      <p>Cupom fictício só para treinar a leitura. Não é nota real da SEFAZ.</p>
    </section>
    <section class="card">
      <h2>Aponte a câmera deste QR</h2>
      <p class="footer-note">Abra <a href="lancar-precos.html">Atualizar Preços</a> no PC (ou em outro aparelho) e leia este código. Itens do catálogo devem atualizar; “CHOCOLATE IMPORTADO” deve ser ignorado.</p>
      <div class="qr-box">
        <img
          id="qr-img"
          alt="QR Code de teste da NFC-e"
          width="320"
          height="320"
        />
      </div>
      <p class="footer-note" id="qr-url"></p>
    </section>
  </main>
  <script>
    (function () {
      var url = new URL("teste-cupom.xml", location.href).href;
      document.getElementById("qr-url").textContent = url;
      document.getElementById("qr-img").src =
        "https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=8&data=" +
        encodeURIComponent(url);
    })();
  </script>
  <script src="nav-drawer.js?v=9"></script>
</body>
</html>
