<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Despensa — Gestão Cardápio Low Carb</title>
  <link rel="stylesheet" href="estilo.css?v=30" />
</head>
<body>
  <main class="wrap">
    <nav class="nav" hidden></nav>

    <section class="hero">
      <h1>Despensa</h1>
      <p>Estoque seco/frasco da 1ª compra. Preços vêm do cadastro em Preços — o lápis abre o produto para ajustar.</p>
      <div class="chips">
        <span class="chip">1ª compra</span>
        <span class="chip">Catálogo de preços</span>
        <span class="chip">Araraquara</span>
      </div>
    </section>

    <section class="card">
      <div class="passo"><div class="passo-num">1</div><div class="passo-body">
        <h3>Compras da despensa</h3>
        <p class="footer-note">Frescos das receitas (cebola, limão, mussarela, molho…) ficam na lista de cada semana. <a href="precos.html">Cadastro de preços</a></p>
      </div></div>
      <div id="lista-despensa"></div>
    </section>
  </main>

  <script src="precos-store.js?v=11"></script>
  <script src="despensa-lista.js?v=5"></script>
  <script src="keep-lista.js?v=15"></script>
  <script src="nav-drawer.js?v=8"></script>
</body>
</html>
